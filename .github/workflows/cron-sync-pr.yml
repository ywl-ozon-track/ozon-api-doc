name: Daily OpenAPI Sync & PR Bot

on:
  schedule:
    # 每天北京时间中午 12:00 (对应 UTC 04:00) 自动触发巡检与对账
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-specs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync upstream specs
        run: python scripts/sync_specs.py

      - name: Generate diff report
        id: diff
        run: |
          python scripts/diff_analyzer.py > pr_report.md
          cat pr_report.md

      - name: Create Pull Request (Never commit directly to main)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(specs): sync latest official Ozon OpenAPI definitions"
          branch: "bot/sync-ozon-specs"
          delete-branch: true
          title: "🤖 [Automated] Sync latest Ozon OpenAPI specifications"
          body-path: pr_report.md
          labels: "automated-sync, api-docs"
          reviewers: "VincentZyu233"
